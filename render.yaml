services:
  - type: web
    name: my-daily-life-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    envVars:
      - key: APP_NAME
        value: "My Daily Life"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: "base64:v/nVbbB7Lid37bz1Fp/kmM+F6/dr4aK+tJSenBArzO4="
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: my-daily-life-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: my-daily-life-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: my-daily-life-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: my-daily-life-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: my-daily-life-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: my-daily-life-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

databases:
  - name: my-daily-life-db
    databaseName: my_daily_life
    user: mdl_user
    plan: free
    region: singapore
