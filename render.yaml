services:
  - type: web
    name: my-daily-life-web
    runtime: php
    region: singapore
    plan: free
    buildCommand: "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader && npm install && npm run build && php artisan storage:link"
    startCommand: "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
    envVars:
      - key: APP_NAME
        value: "My Daily Life"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: my-daily-life-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: my-daily-life-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: my-daily-life-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: my-daily-life-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: my-daily-life-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

databases:
  - name: my-daily-life-db
    databaseName: my_daily_life
    user: mdl_user
    plan: free
    region: singapore
