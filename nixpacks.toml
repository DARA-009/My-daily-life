# Nixpacks configuration for Railway deployment
[phases.setup]
nixPkgs = [
    'php83',
    'php83Extensions.pdo',
    'php83Extensions.pdo_pgsql',
    'php83Extensions.pgsql',
    'php83Extensions.mbstring',
    'php83Extensions.intl',
    'php83Extensions.zip',
    'php83Extensions.bcmath',
    'composer',
    'nodejs_20'
]

[phases.install]
cmds = [
    'composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader',
    'npm ci'
]

[phases.build]
cmds = [
    'npm run build',
    'php artisan storage:link'
]

[start]
cmd = 'php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'
