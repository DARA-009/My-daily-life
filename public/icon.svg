<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1E1B4B" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.25" />
  
  <!-- Central Stylized Calendar / Checklist Icon -->
  <g transform="translate(106, 110)" filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect x="0" y="32" width="300" height="260" rx="40" fill="#FFFFFF" fill-opacity="0.95" />
    <!-- Header Top -->
    <rect x="0" y="32" width="300" height="70" rx="40" fill="#1E293B" />
    <rect x="0" y="80" width="300" height="22" fill="#1E293B" />
    <!-- Binder Rings -->
    <rect x="60" y="12" width="24" height="44" rx="12" fill="#F8FAFC" />
    <rect x="216" y="12" width="24" height="44" rx="12" fill="#F8FAFC" />
    <!-- Checkmark Motif -->
    <path d="M 65 195 L 115 245 L 235 125" fill="none" stroke="#2563EB" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
